# 本地服务访问
server:
  # 服务端口
  port: 8769
  # 服务IP
  address: 0.0.0.0

# eureka注册中心
eureka:
  client:
    serviceUrl:
      # 默认注册中心地址，如果为集群，请指向另一个注册中心，使用域名作为访问路径，如有多个节点，使用逗号','分隔
      #defaultZone: http://127.0.0.1:8761/eureka/,http://192.168.110.35:8761/eureka/,http://192.168.110.36:8761/eureka/
      defaultZone: http://127.0.0.1:8761/eureka/
  instance:
    # 注册到eureka的主机名称
    hostname: 127.0.0.1
    # 注册到eureka的主机IP
    ipAddress: 127.0.0.1
    # 优先使用IP名注册
    prefer-ip-address: true

spring:
  cloud:
    loadbalancer:
      ribbon:
        # 升级版本后，已包启BlockingLoadBalancerClient负载均衡客户端（spring-cloud-loadbalancer），不启用ribbon负载均衡服务
        enabled: false
  application:
    # 应用服务名
    name: examples

# 启用服务健康检测，注册中心将通过http://host:port/actuator/health 检测服务的存活，默认10s一次
management:
  endpoints:
    web:
      exposure:
        include:
        # 开放所有端点health，info，metrics，通过actuator/+端点名就可以获取相应的信息。开发用*，上生产请取消。默认打开health和info
        - "*"
  health:
    # 开启后打印详细信息
    show-details: always
    refresh:
      enabled: true

# 是否启用springboot的debug调试模式，会打印详细日志信息
debug: true

