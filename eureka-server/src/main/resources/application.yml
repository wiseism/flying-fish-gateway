server:
  port: 8761
  address: 0.0.0.0

  # Eureka是Spring Cloud Netflix项目下的服务治理模块
  # 服务注册中心 ：eureka-server
  # 作用：服务注册中心提供服务注册功能
  # 服务提供方：eureka-client
  # 作用：注册服务到服务注册中心

eureka:
  instance:
    hostname: localhost
    # 通过eureka.client.registerWithEureka：false和fetchRegistry：false来表明自己是一个eureka server.
  client:
    # 是否将自己注册到Eureka-Server中，默认的为true
    registerWithEureka: false
    # 是否从Eureka-Server中获取服务注册信息，默认为true
    fetchRegistry: false
    serviceUrl:
      # 默认注册中心地址
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

spring:
  cloud:
    loadbalancer:
      ribbon:
        # 升级版本后，已包启BlockingLoadBalancerClient负载均衡客户端（spring-cloud-loadbalancer），不启用ribbon负载均衡服务
        enabled: false
  application:
    # 应用服务名
    name: eurka-server

# 启用服务健康检测，注册中心将通过http://host:port/actuator/health 检测服务的存活，默认10s一次
management:
  endpoints:
    web:
      exposure:
        include:
        # 开放所有端点health，info，metrics，通过actuator/+端点名就可以获取相应的信息。开发用*，上生产请取消。默认打开health和info
        - "*"
  health:
    # 开启后打印详细信息
    show-details: always
    refresh:
      enabled: true