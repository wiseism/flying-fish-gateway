server:
  port: 8761
  address: 0.0.0.0

  # 此配置提供集群版效果
  # Eureka是Spring Cloud Netflix项目下的服务治理模块，主要提供服务注与发现

  # eureke使用系统域名作为集群中的服务，因此请配置host，如：
  # 192.168.100.1  eureka-node1
  # 192.168.100.2  eureka-node2

  # 启动命令
  # java -jar eureka-server.jar -Dspring.profiles.active=cloud-node2

eureka:
  server:
    #在Eureka服务器获取不到集群里对等服务器上的实例时，需要等待的时间，单位为毫秒，默认为1000 * 60 * 5
    wait-time-in-ms-when-sync-empty: 0
  instance:
    # 设置eureka实例名称，建议与配置文件的变量相同，必须和Linux系统域名相同
    hostname: eureka-node2
    # 通过eureka.client.registerWithEureka：false和fetchRegistry：false来表明自己是一个eureka server.
  client:
    # 是否将自己注册到Eureka-Server中，默认的为true
    registerWithEureka: false
    # 是否从Eureka-Server中获取服务注册信息，默认为true
    fetchRegistry: false
    # 连接到eureka服务器的超时时间，默认，5s
    eureka-server-connect-timeout-seconds: 5
    serviceUrl:
      # 默认注册中心地址，如果为集群，请指向另一个注册中心，使用域名作为访问路径，如有多个节点，使用逗号','分隔
      defaultZone: http://eureka-node1:${server.port}/eureka/

spring:
  application:
    name: eurka-server
