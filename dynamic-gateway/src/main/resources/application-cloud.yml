
spring:
  cloud:
    gateway:
      discovery:
        locator:
          # 启用本地化网关
          enabled: true
          # 将服务名转换为小写
          lower-case-service-id: true
      # 网关跨域配置
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
            - GET
            - POST
      # 路由示例（routes：路由，它由唯一标识（ID）、目标服务地址（uri）、一组断言（predicates）和一组过滤器组成（filters），filters 不是必需参数）
      routes:
      - id: limiter-uri-id
        # 转发到指定url
        uri: http://192.168.11.45:8770
        predicates:
        #- After=2017-01-20T17:42:47.789-07:00[America/Denver]
        # 只限GET请求
        - Method=GET
        # 路径断言匹配
        - Path=/limiter/client/**
        filters:
        - SecureClientId=true
        - SecureIp=true
        - SecureToken=true
        # true则开启认证，false则不开启；指向AuthorizeGatewayFilterFactory
        - Authorize=true
        # StripPrefix=1表示过滤Path第一段（截取/test）
        - StripPrefix=1
        # 在转发url后加参数version=test1
        - AddRequestParameter=version,test
        # 添加熔断机制,当服务不可用时或超过了指定超时长，则转发到fallback
        - name: CustomHystrix
          args:
            # 熔断器名称，默认为fallbackcmd
            name: fallbackcmd
            # 触发熔断的回调路径，需加前缀forward:
            fallbackUri: forward:/fallback?routeId=1
        # 添加限流机器，基于令牌桶算法，当服务超出限流约束，则直接拒决请求
        - name: RequestRateLimiter
          args:
            # 用于限流的键的解析器的 Bean 对象的名字
            key-resolver: '#{@uriKeyResolver}'
            # 令牌桶每秒填充平均速率
            redis-rate-limiter.replenishRate: 1
            # 令牌桶总容量,若设为0，则拒绝所有请求
            redis-rate-limiter.burstCapacity: 1