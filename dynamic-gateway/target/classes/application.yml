# 本地服务访问
server:
  # 服务端口
  port: 8771
  # 服务IP
  address: 0.0.0.0

# eureka注册中心
eureka:
  client:
    serviceUrl:
      # 默认注册中心地址，如果为集群，请指向另一个注册中心，使用域名作为访问路径，如有多个节点，使用逗号','分隔
      defaultZone: http://127.0.0.1:8761/eureka/,http://192.168.110.35:8761/eureka/,http://192.168.110.36:8761/eureka/
  instance:
    # 注册到eureka的主机名称
    hostname: 192.168.11.45
    # 注册到eureka的主机IP
    ipAddress: 192.168.11.45
    # 优先使用IP名注册
    prefer-ip-address: true
    # 注册到eureaka的分组名称
    app-group-name: http-gateway

spring:
  application:
    # 应用服务名
    name: dynamic-gateway
  profiles:
    active: cloud,db

# 启用服务健康检测，注册中心将通过http://host:port/actuator/health 检测服务的存活，默认10s一次
# 查看网关的路由：http://localhost:8888/actuator/gateway/routes
management:
  endpoints:
    web:
      exposure:
        include:
        # 开放所有端点health，info，metrics，通过actuator/+端点名就可以获取相应的信息。开发用*，上生产请取消。默认打开health和info
        - "*"
  health:
    # 开启后打印详细信息
    show-details: always
    refresh:
      enabled: true

# 配置日志
logging:
  config: classpath:log4j2.xml
  level:
    # log 级别
    org.springframework.cloud.gateway: debug

# 熔断器配置
hystrix:
  command:
    default:
      execution:
        timeout:
          # enabled表示是否启用超时检测，默认为true
          enabled: true
        isolation:
          thread:
            # 全局熔断器超时
            timeoutInMilliseconds: 5000
    # myHystrix为熔断器名称，对应：filters.args.name
    myHystrix:
      execution:
        timeout:
          # enabled表示是否启用超时检测，默认为true
          enabled: true
        isolation:
          thread:
            # 特定服务熔断器超时
            timeoutInMilliseconds: 2000
